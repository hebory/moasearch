[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moasearch"
version = "0.1.0"
description = "내장 로컬 AI를 사용하는 개인 파일 검색 도구"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=2.1,<3", "pypdf>=5,<7"]

[project.optional-dependencies]
ai = ["llama-cpp-python==0.3.36"]
test = ["httpx>=0.28,<1"]

[project.scripts]
moasearch = "moasearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moasearch = ["static/*"]

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpu" }

[[tool.uv.index]]
name = "llama-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

